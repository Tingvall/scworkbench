<g><title>op:cell_set_derive
Materialize a selector-derived or explicitly declared cell universe as a named cell set with lifecycle role/status and manifest tables.</title><rect x="40" y="80" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="98" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Derived Cell Set</text><text x="50" y="114" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:cell_set_derive</text></g>
<g><title>op:chromvar
Bias-corrected chromVAR deviations on a peak matrix using genome-backed GC bias and motif matching against a JASPAR PWM catalog.</title><rect x="40" y="152" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="170" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">chromVAR deviations</text><text x="50" y="186" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:chromvar</text></g>
<g><title>op:feature_set_import
Import GMT/RDS/table feature-set libraries into the bundle feature-set registry and emit import provenance tables.</title><rect x="40" y="224" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="242" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Feature-Set Library Import</text><text x="50" y="258" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:feature_set_import</text></g>
<g><title>op:feature_set_namespace_transfer
Transfer matrix-scoped feature-set namespaces between comparable matrices using mirror or intersect semantics.</title><rect x="40" y="296" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="314" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Feature-Set Namespace Transfer</text><text x="50" y="330" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:feature_set_namespace_transfer</text></g>
<g><title>op:metadata_cell_vector
Materialize an imported cell metadata column as a typed, provenance-backed cell vector.</title><rect x="40" y="368" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="386" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Metadata Cell Vector</text><text x="50" y="402" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:metadata_cell_vector</text></g>
<g><title>op:model_bound_latent_union
Combine disjoint fitted-reference and projected-query latent coordinates only when both are bound to the same retained PeakVI or scVI model identity.</title><rect x="40" y="440" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="458" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Model-Bound Latent-Space Union</text><text x="50" y="474" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:model_bound_latent_union</text></g>
<g><title>op:slingshot_adopt
Adopt a checksummed source-derived Slingshot fit as a complete trajectory family without refitting it.</title><rect x="40" y="512" width="260" height="46" rx="8" fill="#b7d9f2" stroke="#555" stroke-opacity="0.55"/><text x="50" y="530" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Adopt an existing Slingshot fit</text><text x="50" y="546" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">op:slingshot_adopt</text></g>
<g><title>primitive:cell_vector
One value per cell, continuous or categorical.</title><rect x="370" y="80" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="98" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Cell Vector</text><text x="380" y="114" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:cell_vector</text></g>
<g><title>primitive:cell_vector_family
Long-form collection of keyed per-cell vectors.</title><rect x="370" y="152" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="170" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Cell Vector Family</text><text x="380" y="186" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:cell_vector_family</text></g>
<g><title>primitive:feature_table
Data frame where rows are feature-centric results such as genes, peaks, or markers.</title><rect x="370" y="224" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="242" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Feature Table</text><text x="380" y="258" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:feature_table</text></g>
<g><title>primitive:matrix
Symbolic reference to a feature-by-cell matrix stored in the bundle.</title><rect x="370" y="296" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="314" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Matrix Reference</text><text x="380" y="330" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:matrix</text></g>
<g><title>primitive:model_ref
Reference to a stored model artifact and the spaces it maps between.</title><rect x="370" y="368" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="386" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Model Reference</text><text x="380" y="402" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:model_ref</text></g>
<g><title>primitive:obs_table
Generic observation-style data frame specialized by table_type and entity_kind.</title><rect x="370" y="440" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="458" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Observation Table</text><text x="380" y="474" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:obs_table</text></g>
<g><title>primitive:path_2d_family
Lineage or curve coordinates in a 2D plotting space.</title><rect x="370" y="512" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="530" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">2D Path Family</text><text x="380" y="546" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:path_2d_family</text></g>
<g><title>primitive:relation_family
Sparse long-form cell-to-key relations with optional weights, values, or distances.</title><rect x="370" y="584" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="602" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Relation Family</text><text x="380" y="618" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:relation_family</text></g>
<g><title>primitive:space
Symbolic reference to a cell embedding or latent space stored in the bundle.</title><rect x="370" y="656" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="674" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Space Reference</text><text x="380" y="690" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:space</text></g>
<g><title>primitive:space_2d
Reference to a two-dimensional cell space, typically UMAP-like coordinates.</title><rect x="370" y="728" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="746" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">2D Space Reference</text><text x="380" y="762" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:space_2d</text></g>
<g><title>primitive:space_path_family
Curves in an arbitrary-dimensional bundle space, represented point-by-dimension.</title><rect x="370" y="800" width="260" height="46" rx="8" fill="#bde8bf" stroke="#555" stroke-opacity="0.55"/><text x="380" y="818" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">High-Dimensional Space Path Family</text><text x="380" y="834" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#333">primitive:space_path_family</text></g>
</svg>
